<!doctype html>
<html lang="es"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SGT | Acceso</title>
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/login.css">
</head>
  
<body><main class="login-container">
  <section class="login-left">
    <div class="logo-box">
      <img src="img/logo.png" class="logo" alt="Logo SGT">
      <h1>SGT</h1>
      <h2>Sistema de Gestión de Tránsito</h2>
      <p>Dirección de Tránsito y Transportes</p>
      <small>Acceso institucional -  Creado por Pablo Cerrutti</small>
    </div>
  </section>
  <section class="login-right">
    <div class="card-login">
      <h2>Ingreso al sistema</h2>
      <p>Ingrese sus credenciales institucionales.</p>
      <form id="loginForm" novalidate>
        <label for="usuario">Usuario</label>
        <input id="usuario" type="text" autocomplete="username" required autofocus>
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">Ingresar</button>
      </form> 
      <p id="mensaje" aria-live="polite"></p>
    </div>
  </section>
</main>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
