name: SGT - Correcciones y ZIP

on:
  push:
    paths:
      - '.github/workflows/correccion-movilidad.yml'

permissions:
  contents: write

env:
  ZIP_NAME: SGT--CLON-CORREGIDO.zip

jobs:
  corregir-y-empaquetar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar integración de correcciones
        shell: python
        run: |
          from pathlib import Path

          # Cargar los módulos de corrección después de los originales.
          mapa_html = Path('modulos/movilidad/mapa.html')
          texto = mapa_html.read_text(encoding='utf-8')
          tag = '<script src="mapa-filtros-fix.js"></script>'
          if tag not in texto:
              texto = texto.replace(
                  '<script src="mapa.js"></script>',
                  '<script src="mapa.js"></script>\n' + tag
              )
              mapa_html.write_text(texto, encoding='utf-8')

          informes_html = Path('modulos/informes/informes.html')
          texto = informes_html.read_text(encoding='utf-8')
          tag = '<script src="informes-fix.js"></script>'
          if tag not in texto:
              texto = texto.replace(
                  '<script src="informes.js"></script>',
                  '<script src="informes.js"></script>\n' + tag
              )
              informes_html.write_text(texto, encoding='utf-8')

          # Los elementos normales deben conservar la localidad seleccionada
          # al momento de guardarlos. Se agrega solo si aún no existe.
          mapa = Path('modulos/movilidad/mapa.js')
          texto = mapa.read_text(encoding='utf-8')
          patron = '''        longitud:\n            document.getElementById(\n                "lng"\n            )?.value || ""\n\n    };'''
          reemplazo = '''        longitud:\n            document.getElementById(\n                "lng"\n            )?.value || "",\n\n        ciudad:\n            document.getElementById(\n                "filtroLocalidad"\n            )?.value || "",\n\n        localidad:\n            document.getElementById(\n                "filtroLocalidad"\n            )?.value || ""\n\n    };'''
          if patron in texto:
              texto = texto.replace(patron, reemplazo, 1)
              mapa.write_text(texto, encoding='utf-8')

      - name: Verificar archivos
        shell: bash
        run: |
          test -f modulos/movilidad/mapa-filtros-fix.js
          test -f modulos/informes/informes-fix.js
          grep -q 'mapa-filtros-fix.js' modulos/movilidad/mapa.html
          grep -q 'informes-fix.js' modulos/informes/informes.html
          grep -q 'puntosZona.length >= 2' modulos/movilidad/mapa.js
          grep -q 'puntosCordon.length === 2' modulos/movilidad/mapa.js

      - name: Guardar correcciones en main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulos/movilidad/mapa.html modulos/movilidad/mapa.js modulos/informes/informes.html
          if git diff --cached --quiet; then
            echo "No hay cambios adicionales"
          else
            git commit -m "fix: integrar correcciones de movilidad e informes"
            git push origin HEAD:main
          fi

      - name: Crear ZIP completo
        shell: bash
        run: |
          rm -f "$ZIP_NAME"
          zip -r "$ZIP_NAME" . \
            -x '.git/*' \
               '.github/workflows/*' \
               "$ZIP_NAME"

      - name: Publicar ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SGT--CLON-CORREGIDO
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
