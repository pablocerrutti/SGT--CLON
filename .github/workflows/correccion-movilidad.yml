name: SGT - Correccion geometrias

on:
  push:
    paths:
      - '.github/workflows/correccion-movilidad.yml'

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corregir mapa.js
        shell: python
        run: |
          from pathlib import Path
          p = Path('modulos/movilidad/mapa.js')
          s = p.read_text(encoding='utf-8')

          old = '''    actualizarTextoAyuda(\n        "Complete los datos del tramo de estacionamiento tarifado y guarde."\n    );\n\n\n    const estadoZona ='''
          new = '''    actualizarTextoAyuda(\n        "Complete los datos del tramo de estacionamiento tarifado y guarde."\n    );\n\n    // El segundo punto cierra el modo dibujo, conservando la linea y coordenadas.\n    dibujandoZona = false;\n    if (mapa) mapa.getContainer().style.cursor = "";\n    const btnNuevaZona = document.getElementById("btnNuevaZona");\n    const btnCancelarZona = document.getElementById("btnCancelarZona");\n    if (btnNuevaZona) btnNuevaZona.style.display = "inline-block";\n    if (btnCancelarZona) btnCancelarZona.style.display = "inline-block";\n\n    const estadoZona ='''
          if old not in s: raise SystemExit('No se encontró finalización de zona')
          s = s.replace(old, new, 1)

          old = '''    actualizarTextoAyuda(\n        "Complete los datos del cordón rojo y guarde."\n    );\n\n\n    const estadoZona ='''
          new = '''    actualizarTextoAyuda(\n        "Complete los datos del cordón rojo y guarde."\n    );\n\n    // El segundo punto cierra el modo dibujo, conservando la linea y coordenadas.\n    dibujandoCordon = false;\n    if (mapa) mapa.getContainer().style.cursor = "";\n    const btnNuevoCordon = document.getElementById("btnNuevoCordon");\n    const btnCancelarCordon = document.getElementById("btnCancelarCordon");\n    if (btnNuevoCordon) btnNuevoCordon.style.display = "inline-block";\n    if (btnCancelarCordon) btnCancelarCordon.style.display = "inline-block";\n\n    const estadoZona ='''
          if old not in s: raise SystemExit('No se encontró finalización de cordón')
          s = s.replace(old, new, 1)

          if 'JSON.stringify(puntosZona);' in s:
              s = s.replace('JSON.stringify(puntosZona);', 'JSON.stringify(puntosZona.slice(0, 2));', 1)
          p.write_text(s, encoding='utf-8')

      - name: Verificar
        shell: bash
        run: |
          grep -q 'dibujandoZona = false' modulos/movilidad/mapa.js
          grep -q 'dibujandoCordon = false' modulos/movilidad/mapa.js
          grep -q 'puntosZona.slice(0, 2)' modulos/movilidad/mapa.js
          grep -q 'puntosCordon.slice(0, 2)' modulos/movilidad/mapa.js
          test -f modulos/movilidad/mapa-filtros-fix.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modulos/movilidad/mapa.js
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "fix: finalizar cordon y estacionamiento en dos puntos"
            git push origin HEAD:main
          fi
